<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoBot - Widget Demo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        /* ============================================================
           DEMO BACKGROUND - Solo para mostrar el widget en contexto
        ============================================================ */
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: #0a1628;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #e2e8f0;
        }
        .demo-page {
            text-align: center;
        }
        .demo-page h1 { font-size: 2rem; font-weight: 600; color: #f1f5f9; }
        .demo-page p { color: #64748b; font-size: 1rem; }

        /* ============================================================
           ECOBOT WIDGET - Copia todo lo que sigue en tu pagina
        ============================================================ */

        /* --- Variables de color del widget --- */
        :root {
            --eb-primary:        #22c55e;
            --eb-primary-dark:   #16a34a;
            --eb-primary-glow:   rgba(34, 197, 94, 0.35);
            --eb-bg:             #0f172a;
            --eb-surface:        #1e293b;
            --eb-surface-2:      #263042;
            --eb-border:         rgba(255,255,255,0.07);
            --eb-text:           #e2e8f0;
            --eb-text-muted:     #64748b;
            --eb-user-bg:        linear-gradient(135deg, #22c55e 0%, #15803d 100%);
            --eb-radius:         20px;
            --eb-font:           'Inter', sans-serif;
        }

        /* --- Botón flotante --- */
        #eb-toggle {
            position: fixed;
            bottom: 28px;
            right: 28px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(145deg, var(--eb-primary), var(--eb-primary-dark));
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 20px var(--eb-primary-glow), 0 2px 8px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1),
                        box-shadow 0.3s ease;
        }
        #eb-toggle:hover {
            transform: scale(1.12);
            box-shadow: 0 8px 30px var(--eb-primary-glow), 0 4px 12px rgba(0,0,0,0.3);
        }
        /* Anillo de pulso */
        #eb-toggle::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: transparent;
            border: 2px solid var(--eb-primary);
            animation: eb-pulse 2.5s ease-out infinite;
        }
        #eb-toggle.eb-open::before { animation: none; }
        @keyframes eb-pulse {
            0%   { transform: scale(1);   opacity: 0.8; }
            100% { transform: scale(1.9); opacity: 0; }
        }

        /* Iconos del botón */
        .eb-icon {
            position: absolute;
            width: 26px;
            height: 26px;
            fill: white;
            transition: opacity 0.25s ease, transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .eb-icon-chat  { opacity: 1; transform: rotate(0deg) scale(1); }
        .eb-icon-close { opacity: 0; transform: rotate(-90deg) scale(0.5); }

        #eb-toggle.eb-open .eb-icon-chat  { opacity: 0; transform: rotate(90deg) scale(0.5); }
        #eb-toggle.eb-open .eb-icon-close { opacity: 1; transform: rotate(0deg) scale(1); }

        /* --- Ventana del chat --- */
        #eb-window {
            position: fixed;
            bottom: 102px;
            right: 28px;
            width: 380px;
            height: 540px;
            background: var(--eb-bg);
            border-radius: var(--eb-radius);
            border: 1px solid var(--eb-border);
            box-shadow:
                0 24px 64px rgba(0,0,0,0.6),
                0 0 0 1px rgba(255,255,255,0.04),
                inset 0 1px 0 rgba(255,255,255,0.06);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            z-index: 9998;
            transform-origin: bottom right;
            transform: scale(0.88) translateY(24px);
            opacity: 0;
            pointer-events: none;
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1),
                        opacity 0.3s ease;
        }
        #eb-window.eb-open {
            transform: scale(1) translateY(0);
            opacity: 1;
            pointer-events: all;
        }

        /* --- Header --- */
        #eb-header {
            background: var(--eb-surface);
            padding: 14px 18px;
            display: flex;
            align-items: center;
            gap: 14px;
            border-bottom: 1px solid var(--eb-border);
            flex-shrink: 0;
            position: relative;
            overflow: hidden;
        }
        /* Línea de acento superior */
        #eb-header::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--eb-primary), var(--eb-primary-dark), transparent);
        }

        /* Avatar del bot - PON TU IMAGEN AQUI */
        .eb-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 2px solid var(--eb-primary);
            overflow: hidden;
            flex-shrink: 0;
            background: var(--eb-surface-2);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .eb-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none; /* Se muestra con JS cuando carga */
        }
        /* Placeholder SVG cuando no hay imagen */
        .eb-avatar-placeholder {
            width: 26px;
            height: 26px;
            fill: var(--eb-primary);
        }

        .eb-header-info { flex: 1; }
        .eb-header-name {
            font-family: var(--eb-font);
            font-size: 0.92rem;
            font-weight: 600;
            color: var(--eb-text);
            margin: 0 0 3px 0;
        }
        .eb-status-row {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .eb-status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--eb-primary);
            box-shadow: 0 0 6px var(--eb-primary);
            animation: eb-blink 2s ease-in-out infinite;
        }
        @keyframes eb-blink {
            0%, 100% { opacity: 1; }
            50%       { opacity: 0.35; }
        }
        .eb-status-text {
            font-family: var(--eb-font);
            font-size: 0.72rem;
            color: var(--eb-text-muted);
            letter-spacing: 0.02em;
        }

        /* --- Área de mensajes --- */
        #eb-messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            scroll-behavior: smooth;
        }
        #eb-messages::-webkit-scrollbar { width: 3px; }
        #eb-messages::-webkit-scrollbar-track { background: transparent; }
        #eb-messages::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.08);
            border-radius: 3px;
        }

        /* Burbujas */
        .eb-bubble {
            max-width: 82%;
            padding: 11px 15px;
            border-radius: 16px;
            font-family: var(--eb-font);
            font-size: 0.86rem;
            line-height: 1.6;
            word-break: break-word;
            animation: eb-slide-in 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) both;
        }
        @keyframes eb-slide-in {
            from { opacity: 0; transform: translateY(10px) scale(0.96); }
            to   { opacity: 1; transform: translateY(0)   scale(1); }
        }
        .eb-bubble.bot {
            background: var(--eb-surface);
            color: #cbd5e1;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            border: 1px solid var(--eb-border);
        }
        .eb-bubble.user {
            background: var(--eb-user-bg);
            color: #fff;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
            box-shadow: 0 4px 16px rgba(22, 163, 74, 0.3);
        }

        /* --- Animación de pensamiento --- */
        .eb-thinking {
            display: flex;
            align-items: center;
            gap: 12px;
            align-self: flex-start;
            background: var(--eb-surface);
            border: 1px solid var(--eb-border);
            border-radius: 16px;
            border-bottom-left-radius: 4px;
            padding: 12px 16px;
            max-width: 82%;
            animation: eb-slide-in 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) both;
        }
        /* Orbita giratoria */
        .eb-orbit {
            position: relative;
            width: 26px;
            height: 26px;
            flex-shrink: 0;
        }
        .eb-orbit-ring {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 2px solid transparent;
            border-top-color: var(--eb-primary);
            border-right-color: rgba(34,197,94,0.3);
            animation: eb-spin 0.9s linear infinite;
        }
        .eb-orbit-ring:nth-child(2) {
            inset: 5px;
            border-top-color: transparent;
            border-bottom-color: var(--eb-primary);
            border-left-color: rgba(34,197,94,0.3);
            animation: eb-spin 1.4s linear infinite reverse;
        }
        .eb-orbit-dot {
            position: absolute;
            inset: 50%;
            width: 5px;
            height: 5px;
            margin: -2.5px;
            border-radius: 50%;
            background: var(--eb-primary);
            box-shadow: 0 0 8px var(--eb-primary);
        }
        @keyframes eb-spin {
            to { transform: rotate(360deg); }
        }
        /* Texto "pensando" con puntos suspensivos animados */
        .eb-thinking-text {
            font-family: var(--eb-font);
            font-size: 0.82rem;
            color: var(--eb-text-muted);
        }
        .eb-thinking-text::after {
            content: '';
            display: inline-block;
            animation: eb-dots 1.5s steps(4, end) infinite;
        }
        @keyframes eb-dots {
            0%   { content: ''; }
            25%  { content: '.'; }
            50%  { content: '..'; }
            75%  { content: '...'; }
            100% { content: ''; }
        }

        /* --- Chips de sugerencias --- */
        #eb-suggestions {
            padding: 2px 16px 12px;
            display: flex;
            flex-wrap: wrap;
            gap: 7px;
            flex-shrink: 0;
        }
        .eb-chip {
            background: transparent;
            border: 1px solid rgba(34, 197, 94, 0.3);
            color: #86efac;
            padding: 5px 13px;
            border-radius: 20px;
            font-family: var(--eb-font);
            font-size: 0.77rem;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s, transform 0.2s;
            white-space: nowrap;
        }
        .eb-chip:hover {
            background: rgba(34, 197, 94, 0.12);
            border-color: rgba(34, 197, 94, 0.6);
            transform: translateY(-2px);
        }

        /* --- Área de input --- */
        #eb-input-area {
            padding: 10px 14px 14px;
            display: flex;
            align-items: flex-end;
            gap: 10px;
            background: var(--eb-surface);
            border-top: 1px solid var(--eb-border);
            flex-shrink: 0;
        }
        #eb-input {
            flex: 1;
            background: var(--eb-surface-2);
            border: 1px solid var(--eb-border);
            border-radius: 14px;
            padding: 10px 14px;
            color: var(--eb-text);
            font-family: var(--eb-font);
            font-size: 0.86rem;
            outline: none;
            resize: none;
            max-height: 110px;
            line-height: 1.5;
            transition: border-color 0.25s, box-shadow 0.25s;
        }
        #eb-input::placeholder { color: var(--eb-text-muted); }
        #eb-input:focus {
            border-color: rgba(34, 197, 94, 0.5);
            box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.08);
        }
        #eb-input:disabled { opacity: 0.4; cursor: not-allowed; }

        /* Botón enviar */
        #eb-send {
            width: 42px;
            height: 42px;
            min-width: 42px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--eb-primary), var(--eb-primary-dark));
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1),
                        opacity 0.2s, box-shadow 0.25s;
            box-shadow: 0 2px 12px var(--eb-primary-glow);
            position: relative;
            overflow: hidden;
        }
        #eb-send::after {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(255,255,255,0);
            transition: background 0.15s;
        }
        #eb-send:hover:not(:disabled)::after { background: rgba(255,255,255,0.12); }
        #eb-send:hover:not(:disabled) {
            transform: scale(1.12);
            box-shadow: 0 4px 20px var(--eb-primary-glow);
        }
        #eb-send:disabled { opacity: 0.35; cursor: not-allowed; transform: scale(1); }
        #eb-send svg { fill: white; width: 18px; height: 18px; flex-shrink: 0; }

        /* Responsive para móvil */
        @media (max-width: 450px) {
            #eb-window {
                right: 0; left: 0;
                bottom: 0;
                width: 100%;
                height: 88vh;
                border-radius: 20px 20px 0 0;
                transform-origin: bottom center;
            }
            #eb-toggle { right: 18px; bottom: 18px; }
        }
    </style>
</head>
<body>

    <!-- PAGINA DE DEMO -->
    <div class="demo-page">
        <h1>Mi Pagina Web</h1>
        <p>El widget de EcoBot aparece flotando en la esquina inferior derecha.</p>
    </div>

    <!-- ============================================================
         ECOBOT WIDGET - Copia desde aqui hasta el final del script
    ============================================================ -->

    <!-- Boton flotante -->
    <button id="eb-toggle" aria-label="Abrir chat EcoBot">
        <!-- Icono chat -->
        <svg class="eb-icon eb-icon-chat" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-2 12H6v-2h12v2zm0-3H6V9h12v2zm0-3H6V6h12v2z"/>
        </svg>
        <!-- Icono cerrar -->
        <svg class="eb-icon eb-icon-close" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
        </svg>
    </button>

    <!-- Ventana del chat -->
    <div id="eb-window" role="dialog" aria-label="Chat EcoBot">

        <!-- Header -->
        <div id="eb-header">
            <div class="eb-avatar">
                <!--
                    INSTRUCCION:
                    Cambia "ruta/a/tu-imagen.png" por la ruta real de tu imagen PNG del bot.
                    Ejemplo si la subes a Hostinger: src="/img/ecobot-avatar.png"
                -->
                <img id="eb-avatar-img" src="ruta/a/tu-imagen.png" alt="EcoBot" />
                <!-- Icono por defecto (se oculta cuando carga la imagen) -->
                <svg class="eb-avatar-placeholder" id="eb-avatar-placeholder" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14H9V8h2v8zm4 0h-2V8h2v8z"/>
                </svg>
            </div>
            <div class="eb-header-info">
                <p class="eb-header-name">EcoBot</p>
                <div class="eb-status-row">
                    <div class="eb-status-dot"></div>
                    <span class="eb-status-text">En linea · Asistente de sostenibilidad</span>
                </div>
            </div>
        </div>

        <!-- Mensajes -->
        <div id="eb-messages"></div>

        <!-- Chips de sugerencias rapidas -->
        <div id="eb-suggestions">
            <button class="eb-chip" onclick="useSuggestion(this)">Como reciclar en casa</button>
            <button class="eb-chip" onclick="useSuggestion(this)">Ahorro de agua</button>
            <button class="eb-chip" onclick="useSuggestion(this)">Energia solar</button>
            <button class="eb-chip" onclick="useSuggestion(this)">Consumo responsable</button>
        </div>

        <!-- Input -->
        <div id="eb-input-area">
            <textarea
                id="eb-input"
                placeholder="Escribe tu pregunta..."
                rows="1"
                maxlength="500"
                aria-label="Mensaje para EcoBot"
            ></textarea>
            <button id="eb-send" aria-label="Enviar mensaje" disabled>
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                </svg>
            </button>
        </div>
    </div>

    <script>
        // =============================================================
        // CONFIGURACION - Solo cambia esta variable
        // =============================================================
        // Para PHP en Hostinger:
        const ECOBOT_API_URL = "https://beige-crane-949224.hostingersite.com/api.php";

        // =============================================================
        // LOGICA INTERNA - No es necesario modificar nada mas abajo
        // =============================================================
        const toggle   = document.getElementById("eb-toggle");
        const chatWin  = document.getElementById("eb-window");
        const messages = document.getElementById("eb-messages");
        const inputEl  = document.getElementById("eb-input");
        const sendBtn  = document.getElementById("eb-send");
        const suggestionsBox = document.getElementById("eb-suggestions");

        // Manejo del avatar: mostrar imagen si carga, sino mostrar SVG por defecto
        const avatarImg = document.getElementById("eb-avatar-img");
        const avatarPH  = document.getElementById("eb-avatar-placeholder");
        avatarImg.onload  = () => { avatarImg.style.display = "block"; avatarPH.style.display = "none"; };
        avatarImg.onerror = () => { avatarImg.style.display = "none";  avatarPH.style.display = "block"; };

        let isOpen = false;

        // Mensaje de bienvenida inicial
        addBotMessage("Hola, soy EcoBot. Estoy aqui para ayudarte con consejos sobre sostenibilidad, reciclaje y cuidado del planeta. Puedes preguntarme lo que necesites.");

        // Abrir / cerrar
        toggle.addEventListener("click", () => {
            isOpen = !isOpen;
            toggle.classList.toggle("eb-open", isOpen);
            chatWin.classList.toggle("eb-open", isOpen);
            if (isOpen) setTimeout(() => inputEl.focus(), 400);
        });

        // Cerrar con Escape
        document.addEventListener("keydown", e => {
            if (e.key === "Escape" && isOpen) toggle.click();
        });

        // Habilitar / deshabilitar boton segun contenido del input
        inputEl.addEventListener("input", () => {
            inputEl.style.height = "auto";
            inputEl.style.height = Math.min(inputEl.scrollHeight, 110) + "px";
            sendBtn.disabled = inputEl.value.trim().length === 0;
        });

        // Enter para enviar, Shift+Enter para nueva linea
        inputEl.addEventListener("keydown", e => {
            if (e.key === "Enter" && !e.shiftKey) {
                e.preventDefault();
                if (!sendBtn.disabled) send();
            }
        });

        sendBtn.addEventListener("click", send);

        function useSuggestion(chip) {
            inputEl.value = chip.textContent;
            inputEl.dispatchEvent(new Event("input")); // recalcula altura y estado del boton
            suggestionsBox.style.display = "none";     // ocultar chips tras usar uno
            send();
        }

        async function send() {
            const text = inputEl.value.trim();
            if (!text) return;

            // Ocultar chips
            suggestionsBox.style.display = "none";

            // Limpiar input
            inputEl.value = "";
            inputEl.style.height = "auto";
            sendBtn.disabled = true;
            inputEl.disabled = true;

            // Burbuja del usuario
            addUserMessage(text);

            // Indicador de pensamiento
            const thinkingEl = addThinking();

            try {
                const res = await fetch(ECOBOT_API_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ prompt: text })
                });

                thinkingEl.remove();

                if (!res.ok) {
                    const err = await res.json().catch(() => ({}));
                    addBotMessage(err.detail || "Ocurrio un error al procesar tu pregunta. Intentalo de nuevo.");
                    return;
                }

                const data = await res.json();
                addBotMessage(
                    (data.status === "success" && data.response)
                        ? data.response
                        : "No pude generar una respuesta. Intentalo de nuevo en un momento."
                );

            } catch (err) {
                thinkingEl.remove();
                addBotMessage("No pude conectarme al servidor. Verifica tu conexion e intentalo nuevamente.");
                console.error("[EcoBot] Error:", err);
            } finally {
                inputEl.disabled = false;
                inputEl.focus();
            }
        }

        function addBotMessage(text) {
            const div = document.createElement("div");
            div.className = "eb-bubble bot";
            div.textContent = text;
            messages.appendChild(div);
            scrollBottom();
            return div;
        }

        function addUserMessage(text) {
            const div = document.createElement("div");
            div.className = "eb-bubble user";
            div.textContent = text;
            messages.appendChild(div);
            scrollBottom();
            return div;
        }

        function addThinking() {
            const div = document.createElement("div");
            div.className = "eb-thinking";
            div.innerHTML = `
                <div class="eb-orbit">
                    <div class="eb-orbit-ring"></div>
                    <div class="eb-orbit-ring"></div>
                    <div class="eb-orbit-dot"></div>
                </div>
                <span class="eb-thinking-text">Analizando</span>
            `;
            messages.appendChild(div);
            scrollBottom();
            return div;
        }

        function scrollBottom() {
            messages.scrollTo({ top: messages.scrollHeight, behavior: "smooth" });
        }
    </script>
</body>
</html>
